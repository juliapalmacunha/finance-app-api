#voce define o nome da github action e quando voce diz que no on é push...
#voce esta dizendo que toda vez que houver um push voce vai rodar essa github action
#quando a gente quer definir uma propriedade dentro de outra isso acontece atraves da indentação

name: Deploy
on: 
  push:
    branches:
      - main


#o job que deve ser executado nessa github action, o nome do job é check, e ele vai rodar em um ambiente ubuntu-latest
jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "24.15.0"

      - name: ESlint
        run: npm run eslint:check

      - name: Prettier
        run: npm run prettier:check
   
      - name: Test
        run: npm run test