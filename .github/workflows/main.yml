on:
  push:
    branches:
      - main

jobs:

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Criamos o arquivo .env.test fisicamente no servidor do GitHub
      - name: Create .env.test file
        run: echo "DATABASE_URL=\"postgresql://postgres:julia123@localhost:5433/financeapp_test?schema=public\"" >> .env.test

      - name: Install dependencies
        run: npm ci --include=dev

      - name: ESlint
        run: npm run eslint:check

      - name: Prettier
        run: npm run prettier:check

      - name: Test
        run: npm run test

  migrate:
    runs-on: ubuntu-latest
    needs: check
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Make env.test file
        uses: SpicyPizza/create-envfile@v2.0
        with:
          envkey_DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Instalamos as dependências do projeto
      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run Prisma Migrations
        run: npx prisma migrate deploy


  deploy:
    runs-on: ubuntu-latest
    needs: migrate
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production
        run: |
          curl "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  

   