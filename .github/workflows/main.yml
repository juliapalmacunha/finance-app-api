name: Deploy
on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # Criamos o arquivo .env.test fisicamente no servidor do GitHub
      - name: Create .env.test file
        run: echo "DATABASE_URL=\"postgresql://postgres:julia123@localhost:5433/financeapp_test?schema=public\"" >> .env.test

      - name: Install dependencies
        run: npm ci

      - name: ESlint
        run: npm run eslint:check

      - name: Prettier
        run: npm run prettier:check

      - name: Test
        run: npm run test