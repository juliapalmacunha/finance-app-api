name: Deploy
on: 
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4 # Atualizado para v4 (versão mais recente)
        with:
          node-version: "20.x" # Dica: a versão 24 do Node ainda não existe como LTS, usei 20.x como exemplo seguro

      - name: Install dependencies
        run: npm ci

      - name: ESlint
        run: npm run eslint:check

      - name: Prettier
        run: npm run prettier:check
    
      - name: Test
        env:
          NODE_ENV: test
          # Ajuste a URL abaixo com o usuário, senha e porta do seu docker-compose.yml
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/finance_test?schema=public"
        run: npm run test